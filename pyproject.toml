[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medops"
version = "1.0.0"
description = "Enterprise Clinic Appointment Booking Platform"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = ["B008", "PLR2004", "E501", "PLR0913", "PLR0912", "PLR0915", "PLR0911", "PLR0917", "N818", "UP042", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/infrastructure/database/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
